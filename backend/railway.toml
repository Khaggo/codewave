[build]
builder = "RAILPACK"
buildCommand = "npm --workspace backend run build:main"
watchPatterns = [
  "/backend/**",
  "/packages/**",
  "/package.json",
  "/package-lock.json",
]

[deploy]
startCommand = "npm --workspace backend run start:main"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
