# Release marker: full-system deployment 2026-08-05.
[build]
builder = "RAILPACK"
buildCommand = "npm --workspace autocare-web run build"
watchPatterns = [
  "/frontend/**",
  "/packages/**",
  "/package.json",
  "/package-lock.json",
]

[deploy]
startCommand = "npm --workspace autocare-web run start -- --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
