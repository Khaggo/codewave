name: Cross-surface E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * *"

concurrency:
  group: cross-surface-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    if: vars.QA_E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      QA_API_BASE_URL: ${{ vars.QA_API_BASE_URL }}
      QA_MOBILE_BASE_URL: ${{ vars.QA_MOBILE_BASE_URL }}
      QA_STAFF_BASE_URL: ${{ vars.QA_STAFF_BASE_URL }}
      QA_CUSTOMER_EMAIL: ${{ secrets.QA_CUSTOMER_EMAIL }}
      QA_CUSTOMER_PASSWORD: ${{ secrets.QA_CUSTOMER_PASSWORD }}
      QA_STAFF_EMAIL: ${{ secrets.QA_STAFF_EMAIL }}
      QA_STAFF_PASSWORD: ${{ secrets.QA_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:e2e
